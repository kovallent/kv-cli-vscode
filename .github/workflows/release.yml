# Publishes the extension when a v* tag is pushed: tests it, packages one
# .vsix, and publishes that same file to the VS Code Marketplace and to Open
# VSX (which Cursor uses).
#
# Needs two repository secrets, added by a maintainer:
#   VSCE_PAT  a Visual Studio Marketplace personal access token for the
#             `kovallent` publisher (Azure DevOps, scope Marketplace > Manage)
#   OVSX_PAT  an Open VSX access token with publish rights on the
#             `kovallent` namespace
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm run typecheck

      - name: Test
        run: xvfb-run -a npm test

      - name: Package
        run: npx vsce package --no-dependencies --out "kv-cli-vscode-$TAG.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: kv-cli-vscode-${{ github.ref_name }}
          path: kv-cli-vscode-${{ github.ref_name }}.vsix

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --packagePath "kv-cli-vscode-$TAG.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "kv-cli-vscode-$TAG.vsix"
