# Runs when a v* tag is pushed. Tests the extension, packages the .vsix once,
# and ships that one file to the VS Code Marketplace, as an asset on the
# tag's GitHub Release, as a workflow artifact, and to Open VSX (which Cursor
# uses). The Marketplace goes first: if it fails, nothing has been published.
#
# Needs no secret: both registries use trusted publishing, through trusted
# publishers registered for this repository and this workflow file
# (release.yml) on the Marketplace (publisher `kovallent`) and on Open VSX.
# The job's `id-token: write` lets vsce and ovsx exchange GitHub's OIDC token
# for short-lived publishing tokens.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and attach the .vsix
      id-token: write # Marketplace and Open VSX trusted publishing
    env:
      TAG: ${{ github.ref_name }}
      VSIX: kv-cli-vscode-${{ github.ref_name }}.vsix
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version (expected tag v$version)"
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - name: Test
        run: xvfb-run -a npm test

      - name: Package the .vsix (once)
        run: npx @vscode/vsce package --no-dependencies --out "$VSIX"

      # First, so a Marketplace failure stops the release before anything is
      # published. --oidc needs vsce 4.x (the repo's own vsce 3.x packages).
      # No VSCE_PAT may be set: vsce refuses --oidc together with a PAT.
      - name: Publish the .vsix to the VS Code Marketplace
        run: npx @vscode/vsce@4.1.1 publish --oidc --packagePath "$VSIX"

      # Every later step ships this one file. A re-run of the job packages
      # again, and a new .vsix is not byte-identical, so when the Release
      # already holds one, that file replaces this run's build: the artifact,
      # the Release and Open VSX always carry the same bytes. (A re-run after
      # a successful Marketplace publish stops at the step above, which fails
      # on a version the Marketplace already has.)
      - name: Attach the .vsix to the GitHub Release
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md)."
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$VSIX"; then
            echo "The Release already holds $VSIX: shipping that file, not this run's build."
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$VSIX" --clobber
          else
            gh release upload "$TAG" "$VSIX" --repo "$GITHUB_REPOSITORY"
          fi
          sha256sum "$VSIX"

      - uses: actions/upload-artifact@v4
        with:
          name: kv-cli-vscode-${{ github.ref_name }}
          path: ${{ env.VSIX }}
          if-no-files-found: error

      # --skip-duplicate: on a re-run after a successful publish, the version
      # is already there, and the file above is the one that was published.
      - name: Publish the same .vsix to Open VSX
        run: npx ovsx publish "$VSIX" --trusted-publishing --skip-duplicate
